<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Dashboard — RezaNih</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>⚡ PROXY — RezaNih</h1>
  <p class="subtitle">Game Config Dashboard · <span id="version">OB55</span></p>
  <p class="status">Server <span id="status">● Online</span></p>

  <div class="card">
    <h2>📱 Device Info</h2>
    <div class="row"><span>IP Address</span><span id="ip">-</span></div>
    <div class="row"><span>Platform</span><span id="platform">-</span></div>
    <div class="row"><span>User Agent</span><span id="ua">-</span></div>
    <div class="row"><span>Waktu</span><span id="time">-</span></div>
  </div>

  <div class="card">
    <h2>🏃 Run Speed</h2>
    <p class="hint">Custom Speed MAX <span id="maxSpeedLabel">10</span></p>
    <input type="range" id="maxSpeed" min="1" max="20" step="0.1" value="10">
    <p class="hint">Default 6.0 · aktifkan untuk custom</p>
    <input type="range" id="runSpeed" min="0.1" max="10" step="0.1" value="6">
    <p class="value">Value: <span id="runSpeedVal">6.0</span></p>
  </div>

  <div class="card">
    <h2>🎯 Sensitivity</h2>
    <p class="hint">Maks sensitivity per scope · default 9.5 · maks 999.99</p>
    <input type="range" id="sens" min="1" max="999.99" step="0.01" value="9.5">
    <p class="value">Value: <span id="sensVal">9.5</span></p>
  </div>

  <button class="save-btn" onclick="saveConfig()">💾 Simpan Config</button>
  <p id="toast" class="toast"></p>
</div>
<script src="script.js"></script>
</body>
</html>
